[build]
command = "npm run build"
publish = "out"

[[edge_functions]]
pattern = "/chat-search"
function = "chat-search"

[[edge_functions]]
pattern = "/.netlify/edge-functions/health"
function = "health"

# contributor-submissions declares its own route via `export const config`
# in netlify/edge-functions/contributor-submissions.js.

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PATCH, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[functions]
directory = "netlify/edge-functions"

[build.environment]
NEXT_USE_NETLIFY_EDGE = "true"
NODE_VERSION = "20"

[dev]
framework = "next"
targetPort = 3000
port = 8888

[[plugins]]
package = "@netlify/plugin-nextjs"